<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Piso</title>
<style>
  :root {
    --bg: #f6f7f5; --card: #ffffff; --ink: #14201e; --muted: #5d6b68;
    --brand: #0f766e; --brand-ink: #ffffff; --income: #15803d; --expense: #b91c1c;
    --line: #dfe5e2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1513; --card: #17211e; --ink: #e8efec; --muted: #94a5a0; --brand: #2dd4bf; --brand-ink: #062a25; --income: #4ade80; --expense: #f87171; --line: #263430; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 16px 16px 40px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 8px 0 16px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .5px; }
  button { font: inherit; cursor: pointer; }
  .ghost { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 8px 12px; }
  .mic-wrap { display: grid; place-items: center; padding: 28px 0 8px; }
  #mic { width: 132px; height: 132px; border-radius: 50%; border: 0; background: var(--brand); color: var(--brand-ink); font-size: 52px; box-shadow: 0 8px 24px rgba(15,118,110,.35); }
  #mic.listening { animation: pulse 1.1s infinite; background: var(--expense); color: #fff; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(185,28,28,.5);} 100% { box-shadow: 0 0 0 28px rgba(185,28,28,0);} }
  #hint { text-align: center; color: var(--muted); min-height: 1.4em; margin: 10px 0 18px; }
  .typed { display: flex; gap: 8px; margin-bottom: 18px; }
  .typed input { flex: 1; }
  input, select { font: inherit; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .primary { background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 15px; color: var(--muted); font-weight: 600; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  .actions { display: flex; gap: 10px; margin-top: 6px; }
  .actions button { flex: 1; }
  .type-income { color: var(--income); } .type-expense { color: var(--expense); } .type-transfer { color: var(--muted); }
  #log { list-style: none; margin: 0; padding: 0; }
  #log li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  #log li:first-child { border-top: 0; }
  #log small { color: var(--muted); display: block; }
  #status { font-size: 13px; color: var(--muted); text-align: center; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Piso</h1>
    <div>
      <button class="ghost" id="undoBtn">Undo last</button>
      <button class="ghost" id="settingsBtn">Settings</button>
    </div>
  </header>

  <div class="mic-wrap"><button id="mic" aria-label="Tap to speak">🎤</button></div>
  <div id="hint">Tap the mic and say “Minus 29 for coffee”</div>

  <form class="typed" id="typedForm">
    <input id="typed" placeholder="…or type it: plus 6890.90 into BDO" autocomplete="off">
    <button class="primary" type="submit">Go</button>
  </form>

  <section class="card hidden" id="confirm">
    <h2>Confirm entry</h2>
    <div class="row">
      <div><label for="fType">Type</label>
        <select id="fType"><option>Expense</option><option>Income</option><option>Transfer</option></select></div>
      <div><label for="fAmount">Amount (₱)</label>
        <input id="fAmount" inputmode="decimal"></div>
    </div>
    <div class="row">
      <div><label for="fAccount" id="fAccountLabel">Account</label><select id="fAccount"></select></div>
      <div id="catWrap"><label for="fCategory">Category</label><select id="fCategory"></select></div>
      <div id="toWrap" class="hidden"><label for="fTo">To account</label><select id="fTo"></select></div>
    </div>
    <label for="fNote">Note</label>
    <input id="fNote" style="margin-bottom:10px">
    <div class="actions">
      <button class="ghost" id="cancelBtn" type="button">Cancel</button>
      <button class="primary" id="saveBtn" type="button">Save</button>
    </div>
  </section>

  <section class="card hidden" id="settings">
    <h2>Settings</h2>
    <label for="sUrl">Apps Script web app URL</label>
    <input id="sUrl" placeholder="https://script.google.com/macros/s/.../exec" style="margin-bottom:10px">
    <label for="sToken">Secret token</label>
    <input id="sToken" type="password" style="margin-bottom:10px">
    <label for="sAccounts">Accounts (comma separated)</label>
    <input id="sAccounts" style="margin-bottom:10px">
    <label for="sDefault">Default account</label>
    <input id="sDefault" style="margin-bottom:10px">
    <label for="sAliases">Nicknames (optional): what you say = account</label>
    <input id="sAliases" placeholder="bpi family=BPI, ewallet=GCash" style="margin-bottom:10px">
    <label for="sLang">Speech language</label>
    <select id="sLang" style="margin-bottom:10px">
      <option value="en-PH">English (Philippines)</option>
      <option value="fil-PH">Filipino</option>
      <option value="en-US">English (US)</option>
    </select>
    <div class="actions">
      <button class="ghost" id="settingsClose" type="button">Close</button>
      <button class="primary" id="settingsSave" type="button">Save settings</button>
    </div>
  </section>

  <section class="card">
    <h2>Recent</h2>
    <ul id="log"></ul>
  </section>
  <div id="status"></div>
</main>

<script src="parser.js"></script>
<script>
/* Words, accounts and categories live in parser.js */
const P = window.PisoParser;
const HINT = 'Tap the mic and say “Minus 29 for coffee”';

/* ---------- Storage ---------- */
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let cfg = {
  url: store.get('piso.url', ''),
  token: store.get('piso.token', ''),
  accounts: store.get('piso.accounts', P.DEFAULT_ACCOUNTS),
  defaultAccount: store.get('piso.defaultAccount', 'Cash'),
  aliases: store.get('piso.aliases', ''),
  lang: store.get('piso.lang', 'en-PH')
};
let queue = store.get('piso.queue', []);     // unsent entries (offline)
let recent = store.get('piso.recent', []);   // local display log
let learned = store.get('piso.learned', {}); // your category corrections: note -> category

const parseOpts = () => ({ accounts: cfg.accounts, defaultAccount: cfg.defaultAccount, aliases: P.parseAliases(cfg.aliases), learned });
const newId = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- UI ---------- */
function fillSelect(sel, items, value) {
  sel.innerHTML = '';
  items.forEach((i) => { const o = document.createElement('option'); o.textContent = i; sel.appendChild(o); });
  if (value && items.includes(value)) sel.value = value;
}
function peso(n) { return '₱' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function setStatus(msg) { $('status').textContent = msg || ''; }

function syncTypeUI() {
  const transfer = $('fType').value === 'Transfer';
  $('catWrap').classList.toggle('hidden', transfer);
  $('toWrap').classList.toggle('hidden', !transfer);
  $('fAccountLabel').textContent = transfer ? 'From account' : 'Account';
}

function showConfirm(p) {
  if (!p || !p.amount) { $('hint').textContent = 'Couldn’t find an amount in: “' + (p ? p.raw : '') + '”. Try again.'; return; }
  $('fType').value = p.type;
  $('fAmount').value = p.amount;
  fillSelect($('fAccount'), cfg.accounts, p.account);
  fillSelect($('fTo'), cfg.accounts, p.toAccount || cfg.accounts.find((a) => a !== p.account));
  fillSelect($('fCategory'), P.CATEGORIES, p.type === 'Transfer' ? 'Other' : p.category);
  $('fNote').value = p.note;
  $('confirm').dataset.raw = p.raw;
  $('confirm').dataset.suggested = $('fCategory').value;
  syncTypeUI();
  $('confirm').classList.remove('hidden');
  $('hint').textContent = '“' + p.raw + '”';
}
function renderLog() {
  const ul = $('log'); ul.innerHTML = '';
  if (!recent.length) { ul.innerHTML = '<li><span>No entries yet</span></li>'; return; }
  recent.slice(0, 8).forEach((t) => {
    const transfer = t.type === 'Transfer';
    const li = document.createElement('li');
    const left = document.createElement('span');
    left.textContent = t.note || (transfer ? 'Transfer' : t.category);
    const small = document.createElement('small');
    small.textContent = (transfer ? t.account + ' → ' + t.toAccount : t.account + ' · ' + t.category) + (t.pending ? ' · queued' : '');
    left.appendChild(small);
    const right = document.createElement('strong');
    right.className = transfer ? 'type-transfer' : t.type === 'Income' ? 'type-income' : 'type-expense';
    right.textContent = (transfer ? '⇄ ' : t.type === 'Income' ? '+' : '−') + peso(t.amount);
    li.append(left, right); ul.appendChild(li);
  });
}

/* ---------- Network ---------- */
async function post(payload) {
  if (!cfg.url || !cfg.token) throw new Error('Set URL and token in Settings first');
  const res = await fetch(cfg.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: cfg.token, ...payload })
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Server error');
  return data;
}
async function flushQueue() {
  if (!queue.length || !navigator.onLine || !cfg.url) return;
  const remaining = [];
  for (const tx of queue) {
    // safe to resend: the sheet skips an ID it already has
    try { await post({ action: 'add', tx }); recent.forEach((r) => { if (r.id === tx.id) delete r.pending; }); }
    catch { remaining.push(tx); }
  }
  queue = remaining; store.set('piso.queue', queue); store.set('piso.recent', recent); renderLog();
  setStatus(queue.length ? queue.length + ' entries still queued' : '');
}

// When you fix the category by hand, remember it for next time ("ulam" -> Food)
function learn(tx) {
  if (tx.type === 'Transfer' || !tx.note || tx.category === $('confirm').dataset.suggested) return;
  learned[P.learnKey(tx.note)] = tx.category;
  store.set('piso.learned', learned);
}

async function saveEntry() {
  const type = $('fType').value;
  const tx = {
    id: newId(),
    type,
    amount: parseFloat($('fAmount').value),
    account: $('fAccount').value,
    category: type === 'Transfer' ? 'Transfer' : $('fCategory').value,
    note: $('fNote').value.trim(),
    raw: $('confirm').dataset.raw || ''
  };
  if (type === 'Transfer') tx.toAccount = $('fTo').value;
  if (!(tx.amount > 0)) { setStatus('Enter a valid amount'); return; }
  if (type === 'Transfer' && tx.toAccount === tx.account) { setStatus('Pick two different accounts for a transfer'); return; }
  learn(tx);
  $('saveBtn').disabled = true;
  try {
    await post({ action: 'add', tx });
    recent.unshift(tx);
    setStatus('Saved ' + peso(tx.amount));
  } catch (err) {
    if (!cfg.url || !cfg.token) { setStatus(err.message); $('saveBtn').disabled = false; return; }
    queue.push(tx); store.set('piso.queue', queue);
    recent.unshift({ ...tx, pending: true });
    setStatus('Offline or failed — queued, will retry. (' + err.message + ')');
  }
  store.set('piso.recent', recent.slice(0, 30));
  $('confirm').classList.add('hidden');
  $('hint').textContent = HINT;
  $('saveBtn').disabled = false;
  renderLog();
}

// Removes exactly the newest entry in Recent, by its ID (both rows of a transfer)
async function undoLast() {
  const last = recent[0];
  if (!last) { setStatus('Nothing to undo'); return; }
  if (!confirm('Remove “' + (last.note || last.category) + '” ' + peso(last.amount) + '?')) return;
  const drop = (msg) => { recent.shift(); store.set('piso.recent', recent); renderLog(); setStatus(msg); };
  if (last.pending) {
    queue = queue.filter((q) => q.id !== last.id); store.set('piso.queue', queue);
    drop('Queued entry removed');
    return;
  }
  try {
    await post({ action: 'undo', id: last.id });
    drop('Last entry removed');
  } catch (err) {
    if (/not found/.test(err.message)) drop('That entry isn’t in the sheet any more, removed it from this list');
    else setStatus('Undo failed: ' + err.message);
  }
}

/* ---------- Voice ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function startListening() {
  if (!SR) { $('hint').textContent = 'Voice not supported here — use the text box or your keyboard mic.'; return; }
  rec = new SR();
  rec.lang = cfg.lang || 'en-PH';
  rec.interimResults = true;
  rec.maxAlternatives = 5; // several guesses; the parser keeps the one that makes most sense
  rec.onstart = () => { $('mic').classList.add('listening'); $('hint').textContent = 'Listening…'; };
  rec.onresult = (e) => {
    const r = e.results[e.results.length - 1];
    $('hint').textContent = r[0].transcript;
    if (r.isFinal) showConfirm(P.pickBest(Array.from(r, (a) => a.transcript), parseOpts()));
  };
  rec.onerror = (e) => { $('hint').textContent = 'Mic error: ' + e.error; };
  rec.onend = () => $('mic').classList.remove('listening');
  rec.start();
}

/* ---------- Wiring ---------- */
$('mic').addEventListener('click', () => {
  if ($('mic').classList.contains('listening') && rec) rec.stop(); else startListening();
});
$('typedForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = $('typed').value.trim();
  if (v) { showConfirm(P.parse(v, parseOpts())); $('typed').value = ''; }
});
$('fType').addEventListener('change', () => {
  // keep the fallback category in step when the type is switched by hand
  const c = $('fCategory');
  if ($('fType').value === 'Income' && c.value === 'Other') c.value = 'Other Income';
  if ($('fType').value === 'Expense' && c.value === 'Other Income') c.value = 'Other';
  syncTypeUI();
});
$('saveBtn').addEventListener('click', saveEntry);
$('cancelBtn').addEventListener('click', () => { $('confirm').classList.add('hidden'); $('hint').textContent = 'Cancelled'; });
$('undoBtn').addEventListener('click', undoLast);

function fillSettings() {
  $('sUrl').value = cfg.url; $('sToken').value = cfg.token;
  $('sAccounts').value = cfg.accounts.join(', '); $('sDefault').value = cfg.defaultAccount;
  $('sAliases').value = cfg.aliases; $('sLang').value = cfg.lang;
}
$('settingsBtn').addEventListener('click', () => { fillSettings(); $('settings').classList.toggle('hidden'); });
$('settingsClose').addEventListener('click', () => $('settings').classList.add('hidden'));
$('settingsSave').addEventListener('click', () => {
  cfg.url = $('sUrl').value.trim();
  cfg.token = $('sToken').value.trim();
  cfg.accounts = $('sAccounts').value.split(',').map((s) => s.trim()).filter(Boolean);
  if (!cfg.accounts.length) cfg.accounts = P.DEFAULT_ACCOUNTS;
  cfg.defaultAccount = cfg.accounts.includes($('sDefault').value.trim()) ? $('sDefault').value.trim() : cfg.accounts[0];
  cfg.aliases = $('sAliases').value.trim();
  cfg.lang = $('sLang').value;
  store.set('piso.url', cfg.url); store.set('piso.token', cfg.token);
  store.set('piso.accounts', cfg.accounts); store.set('piso.defaultAccount', cfg.defaultAccount);
  store.set('piso.aliases', cfg.aliases); store.set('piso.lang', cfg.lang);
  $('settings').classList.add('hidden');
  setStatus('Settings saved'); flushQueue();
});

window.addEventListener('online', flushQueue);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (!cfg.url || !cfg.token) { fillSettings(); $('settings').classList.remove('hidden'); }
renderLog(); flushQueue();
</script>
</body>
</html>
